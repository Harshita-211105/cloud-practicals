<!DOCTYPE html>
<html>
<head>
    <title>Student Record Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Student Record Management System</h1>

    <div class="form-section">
        <h2>Add Student</h2>

        <input type="hidden" id="studentId">

        <input type="text" id="name" placeholder="Student Name">
        <input type="text" id="roll_no" placeholder="Roll Number">
        <input type="email" id="email" placeholder="Email Address">
        <input type="text" id="course" placeholder="Course">
        <input type="text" id="year" placeholder="Year">

        <button onclick="saveStudent()">Save Student</button>
        <button class="clear-btn" onclick="clearForm()">Clear Form</button>

        <p id="message"></p>
    </div>

    <div class="action-section">
        <h2>Search Student</h2>

        <input type="text" id="searchRoll" placeholder="Enter Roll Number">
        <button onclick="searchStudent()">Search</button>
        <button class="view-btn" onclick="loadStudents()">View All Students</button>
        <button class="clear-btn" onclick="clearResults()">Clear Results</button>
    </div>

    <h2>Student Records</h2>
    <div id="students"></div>
</div>

<script src="script.js"></script>
</body>
</html>
